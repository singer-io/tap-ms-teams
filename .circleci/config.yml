version: 2.1
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-ms-teams
            source /usr/local/share/virtualenvs/tap-ms-teams/bin/activate
            uv pip install -U setuptools
            uv pip install .[dev]
      - add_ssh_keys
      - run:
          name: "JSON Validator"
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            stitch-validate-json tap_ms_teams/schemas/*.json
      - run:
          name: 'Pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-ms-teams/bin/activate
            uv pip install pylint
            pylint tap_ms_teams -d C,R,W
